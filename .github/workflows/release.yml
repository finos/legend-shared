name: Release

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "New release version"
        required: true

jobs:
  prepare:
    name: Prepare
    # Validation only, and it runs before `verify` so that a typo in
    # releaseVersion or a branch that has moved costs seconds rather than a
    # full test matrix.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Check the release ref
        run: |
          set -euo pipefail
          # The version bump at the end of this run commits onto the ref this
          # was dispatched from, so it has to be a branch, and it has to still
          # be where it was when the run started. Fail here, before anything
          # is built or published. This is not the only guard: that bump is
          # pushed plain and never forced, so git still rejects it if the
          # branch moves between this check and the end of the run.
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "::error::A release must be dispatched from a branch; got ${GITHUB_REF}."
              exit 1
              ;;
          esac
          tip="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${tip} after this run was dispatched. Nothing has been published; dispatch the release again."
            exit 1
          fi

      - name: Check release version is unused
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          TAG: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::releaseVersion must be MAJOR.MINOR.PATCH; got '${RELEASE_VERSION}'."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; ${RELEASE_VERSION} has been released."
            exit 1
          fi
          # The branch has to be on a snapshot, and the release must not go
          # backwards from it. The tag check above catches re-releasing a
          # version that shipped; this catches a typo naming one that never
          # did, which nothing else would notice.
          current="$(python3 -c 'import xml.etree.ElementTree as ET; ns="{http://maven.apache.org/POM/4.0.0}"; print(ET.parse("pom.xml").getroot().find(ns + "properties").find(ns + "revision").text)')"
          case "${current}" in
            *-SNAPSHOT) ;;
            *)
              echo "::error::The root pom is at ${current}, not a snapshot; this branch is not in a releasable state."
              exit 1
              ;;
          esac
          base="${current%-SNAPSHOT}"
          if [ "$( { echo "${base}"; echo "${RELEASE_VERSION}"; } | sort -V | head -n 1 )" != "${base}" ]; then
            echo "::error::releaseVersion ${RELEASE_VERSION} is below the branch's current version ${current}."
            exit 1
          fi

  verify:
    # The build-once, test-on-every-JDK pipeline, shared with `Build CI` so
    # that a release is tested exactly the way ordinary CI tests. Pinned to
    # the commit this run was dispatched for, which `prepare` has just
    # confirmed is still the branch tip.
    needs: prepare
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ github.sha }}
      # A release always exercises every supported JDK, whatever branch it
      # was cut from.
      jdks: '[25, 21, 17]'
    secrets: inherit

  release:
    # Publish only once every JDK has gone green against this commit.
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Build release
        # Tests are skipped: the `verify` job already ran the whole suite on
        # every supported JDK against this exact commit, so this build only
        # needs to compile, sign and package what the bundle below publishes.
        #
        # `clean` on a checkout nothing has built yet is a no-op, and that is
        # the point: it keeps what gets published independent of whatever
        # steps this job grows above it.
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          MAVEN_OPTS: -Xmx14g
        run: mvn -B -e -T2 -DskipTests -Drevision="${RELEASE_VERSION}" clean install -P release,docker

      - name: Create bundle to publish
        run: |
          mkdir -p central-staging/org/finos/legend
          cp -R ~/.m2/repository/org/finos/legend/shared central-staging/org/finos/legend
          find central-staging -type f \( -name "*.xml" -o -name "*.repositories" \) -delete
          find central-staging -type f ! -name "*.md5" ! -name "*.sha1" ! -name "*.sha256" ! -name "*.sha512" ! -name "*.asc" | while read -r file; do
            md5sum "$file" | awk '{print $1}' > "$file.md5"
            sha1sum "$file" | awk '{print $1}' > "$file.sha1"
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
            sha512sum "$file" | awk '{print $1}' > "$file.sha512"
          done

          mkdir central-publishing
          cd central-staging && zip -r ../central-publishing/central-bundle.zip org

      - name: Verify the release version resolves in every pom
        run: |
          set -euo pipefail
          # flatten-maven-plugin is what rewrites the revision property into
          # the poms that `install` put in the local repository, which are the
          # poms the bundle carries. Check the bundle's own copies before
          # uploading it: it is published automatically, so a pom that reaches
          # Maven Central still carrying an unresolved property cannot be
          # withdrawn.
          if grep -rlF '${revision}' --include='*.pom' central-staging; then
            echo "::error::A pom above still carries an unresolved revision property; flatten-maven-plugin did not resolve it."
            exit 1
          fi
          count="$(find central-staging -name '*.pom' | wc -l)"
          echo "${count} poms in the bundle"
          [ "${count}" -gt 0 ]

      - name: Publish bundle
        working-directory: central-publishing
        run: |
          token=$(printf "$CI_DEPLOY_USERNAME:$CI_DEPLOY_PASSWORD" | base64)
          httpCode=$(curl -s -o response.json -w "%{http_code}" -X POST -H "Authorization: Bearer $token" --form bundle=@central-bundle.zip https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC)
          
          if [[ "$httpCode" == 2* ]]; then
            deploymentId=$(cat response.json)
            echo "Uploaded bundle. Deployment id is: $deploymentId"
            echo "DEVELOPMENT_ID=${deploymentId}" >> $GITHUB_ENV
          else
            echo "Failed to upload bundle. Got status code $httpCode"
            echo "Got the following response body:"
            cat response.json
            exit 1
          fi

      - name: Verify deployment status
        run: |
          token=$(printf "$CI_DEPLOY_USERNAME:$CI_DEPLOY_PASSWORD" | base64)
          deploymentId=${{ env.DEVELOPMENT_ID }}
          
          deploymentState=""
          
          while [ "$deploymentState" != "PUBLISHED" ]; do
            sleep 1m
            response=$(curl -s -X POST -H "Authorization: Bearer $token" https://central.sonatype.com/api/v1/publisher/status?id=$deploymentId)
            deploymentState=$(echo "$response" | jq -r '.deploymentState')
            echo "Deployment state for id $deploymentId is $deploymentState"
          
            if [[ "$deploymentState" == "FAILED" ]]; then
              echo "The deployment failed with the following response"
              echo "$response"
              exit 1
            fi
          done

      - name: Create and push git tag
        # Only once Maven Central has published the bundle, so the tag records
        # a release that has gone out. A failed upload or validation leaves no
        # tag behind to block dispatching the same version again.
        env:
          TAG: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Compute and set next SNAPSHOT
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION}"
          nextSnapshot="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          # Committed onto the commit that was built, published and tagged,
          # never onto whatever the remote tip has become, so the push below
          # is a plain fast-forward: if anything landed on the branch while
          # this ran, git rejects it rather than reverting a revision somebody
          # else changed.
          git checkout -B "${GITHUB_REF_NAME}" HEAD
          sed -i "s|<revision>.*</revision>|<revision>${nextSnapshot}</revision>|" pom.xml
          if git diff --quiet -- pom.xml; then
            echo "::error::sed left pom.xml unchanged; set <revision> to ${nextSnapshot} by hand on ${GITHUB_REF_NAME}."
            exit 1
          fi
          git add pom.xml
          git commit -m "Bump version to ${nextSnapshot}"
          git push origin "${GITHUB_REF_NAME}"
