# The build-once, test-on-every-JDK pipeline, shared by `Build CI` and
# `Release` so that a release is tested exactly the way ordinary CI tests.
# Do not inline a copy of this into a caller: the whole point is that the
# release cannot drift away from what CI does.
#
# The build always runs on JDK 25 and compiles to Java 17 bytecode
# (maven.compiler.release). Only the forked test JVM changes between legs.
name: Build and Test

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build. Defaults to whatever triggered the caller."
        type: string
        required: false
        default: ''
      jdks:
        description: "JSON array of JDKs for the test matrix. Defaults to the repository/ref heuristic below."
        type: string
        required: false
        default: ''
      upload-event-file:
        description: "Upload the triggering event payload, which the `Publish Test Results` workflow needs for a PR or a master build."
        type: boolean
        required: false
        default: false

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      test-jdks: ${{ steps.test-matrix.outputs.jdks }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # Empty means "whatever triggered the caller", which is what CI
          # wants; the release workflow passes the commit it is releasing.
          ref: ${{ inputs.ref }}

      - name: Determine test JDK matrix
        id: test-matrix
        env:
          JDKS: ${{ inputs.jdks }}
        run: |
          set -euo pipefail
          # An explicit list wins: a release exercises every supported JDK no
          # matter which branch it was cut from. Otherwise master builds of
          # the canonical repo exercise every supported JDK, and everything
          # else (PRs, forks, topic branches) sticks to the two boundary
          # versions, which is what keeps ordinary CI turnaround short.
          if [ -n "${JDKS}" ]; then
            echo "jdks=${JDKS}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "finos/legend-shared" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo 'jdks=[25, 21, 17]' >> "$GITHUB_OUTPUT"
          else
            echo 'jdks=[25, 17]' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          # Never cache this project's own artifacts: the cache is only
          # refreshed when a pom.xml changes, so cached project jars go stale
          # on Java-only commits and would shadow the current build's output.
          # The test jobs get this build's jars from the archive below.
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/finos/legend/shared
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      - name: Download deps and plugins
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies

      - name: Build
        # Tests are skipped here so they run once per JDK in the matrix below
        # rather than once here and again per JDK.
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=80.0
        run: mvn -B -e -T 4 -DskipTests install javadoc:javadoc -Dorg.slf4j.simpleLogger.showThreadName=true

      - name: Archive build output
        # Bundle the whole workspace (compiled classes, test resources) into
        # one file so the test jobs can reuse this build instead of
        # recompiling. The .git dir isn't needed downstream.
        # Also bundle the project's own artifacts that `mvn install` put in
        # the local repository: `mvn surefire:test` resolves inter-module
        # dependencies from ~/.m2, so the test jobs must get THIS build's jars
        # rather than whatever project jars the Maven dependency cache carries.
        run: |
          cp -r ~/.m2/repository/org/finos/legend/shared project-artifacts
          tar -cf build-output.tar --exclude='.git' .

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build-output.tar
          retention-days: 1

      - name: Upload CI Event
        # Consumed by the `Publish Test Results` workflow, which reports only
        # on `Build CI` runs for PRs and master; no other run has anything to
        # publish it to.
        if: ${{ always() && inputs.upload-event-file }}
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  test:
    name: Test (JDK ${{ matrix.jdk }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ${{ fromJSON(needs.build.outputs.test-jdks) }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: build-output

      - name: Extract build output
        run: tar -xf build-output.tar

      - name: Restore Maven dependencies
        # Restore-only: the build job already saved this exact key, so there
        # is nothing here that could be new.
        uses: actions/cache/restore@v5
        env:
          cache-name: cache-mvn-deps
        with:
          # Never restore this project's own artifacts (see the build job).
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/finos/legend/shared
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          # 25 always: Maven itself runs on the same JDK in every leg, so the
          # only thing that varies is the forked test JVM. The matrix JDK is
          # what that fork will use. When the matrix leg *is* 25 the duplicate
          # is a no-op (second install is a tool-cache hit).
          distribution: 'temurin'
          java-version: |
            25
            ${{ matrix.jdk }}

      - name: Install project artifacts from this build
        # Inter-module dependencies resolve from ~/.m2 during surefire:test,
        # so they must be the jars installed by this run's build job -- never
        # project jars left over in the restored dependency cache.
        run: |
          rm -rf ~/.m2/repository/org/finos/legend/shared
          mkdir -p ~/.m2/repository/org/finos/legend
          cp -r project-artifacts ~/.m2/repository/org/finos/legend/shared

      - name: Test
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0
        run: |
          # Maven runs on 25 in every leg; each leg just points Surefire's
          # forked test JVM at the matrix JDK's install. The test classes
          # already target Java 17 bytecode, so every leg runs the same class
          # files.
          export JAVA_HOME="$JAVA_HOME_25_X64"
          test_jvm_home="JAVA_HOME_${{ matrix.jdk }}_X64"
          TEST_JVM="${!test_jvm_home}/bin/java"
          mvn -B -e surefire:test -Djvm="${TEST_JVM}" -DargLine="-XX:MaxRAMPercentage=50.0" -DforkCount=1

      - name: Summarize test results
        # Puts this leg's results on the run's summary page, for every caller:
        # PRs, master, release branches, and releases alike. Reporting only, so
        # a problem here never fails the leg, and so never blocks a release.
        # The script comes from the build output extracted above.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .github/scripts/test-summary.py --title "JDK ${{ matrix.jdk }}" legend-shared-test-reports/surefire-reports-aggregate

      - name: Upload Test Results
        # Every leg writes to the same repo-relative directory, but each runs
        # in its own workspace, so the per-JDK artifact name is what keeps
        # them apart for `Publish Test Results`.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jdk${{ matrix.jdk }}
          path: legend-shared-test-reports/surefire-reports-aggregate/*.xml
